<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Point dos Malokas</title>
  <link rel="stylesheet" href="/admin/assets/css/admin.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: auto; }
    .login-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      width: 100%;
      max-width: 380px;
      margin: 1rem;
    }
    .login-logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--gold); margin-bottom: .25rem; }
    .login-sub { font-size: .78rem; color: var(--gray); margin-bottom: 2rem; }
    .login-title { font-size: 1.8rem; color: var(--white); margin-bottom: .25rem; }
    .error-msg { background: rgba(255,59,59,.1); border: 1px solid rgba(255,59,59,.3); border-radius: 8px; padding: .7rem 1rem; font-size: .82rem; color: var(--red); margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-logo">Point.Malokas</div>
    <div class="login-sub">Painel Administrativo</div>
    <h2 class="login-title">ENTRAR</h2>

    <div class="error-msg" id="errorMsg"></div>

    <div class="form-group">
      <label>Usuário</label>
      <input type="text" class="form-control" id="username" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" class="form-control" id="password" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button class="btn btn-gold btn-block" id="loginBtn" onclick="doLogin()" style="margin-top:.5rem;padding:.85rem;">
      Entrar →
    </button>

    <div style="margin-top:1.5rem;text-align:center;">
      <a href="/" style="font-size:.78rem;color:var(--gray);">← Voltar ao site</a>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('pdm_admin_token')) {
      window.location.href = '/admin/dashboard.html';
    }

    document.getElementById('password').addEventListener('keydown', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('errorMsg');
      const btn = document.getElementById('loginBtn');

      if (!username || !password) {
        showError('Preencha usuário e senha.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Entrando...';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (!res.ok) throw new Error(data.error);

        localStorage.setItem('pdm_admin_token', data.token);
        localStorage.setItem('pdm_admin_user', data.username);
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        showError(err.message || 'Erro ao fazer login.');
        btn.disabled = false;
        btn.innerHTML = 'Entrar →';
      }
    }

    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }

    function showToast(msg, type = 'error') {
      const c = document.getElementById('toastContainer');
      const t = document.createElement('div');
      t.className = `toast ${type}`;
      t.textContent = msg;
      c.appendChild(t);
      setTimeout(() => t.remove(), 3000);
    }
  </script>
</body>
</html>
